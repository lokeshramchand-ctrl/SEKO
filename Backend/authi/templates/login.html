{% extends "authentication/base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h2>Login</h2>

<label for="email">Email</label>
<input id="email" type="email" placeholder="you@example.com" />

<label for="password">Password</label>
<input id="password" type="password" />

<button id="submitBtn">Sign in</button>

<div id="result" class="msg" style="display:none"></div>

<p class="muted">Don't have an account? <a href="/auth/register/">Register</a></p>
<p class="muted"><a href="/auth/forgot/">Forgot password?</a></p>

<script>
const api = '/api/login/'; // adjust if needed

document.getElementById('submitBtn').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const resBox = document.getElementById('result');
  resBox.style.display = 'none';

  try {
    const r = await fetch(api, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const data = await r.json();
    if (r.ok) {
      // If your login view returns tokens, store them
      // Example: { access: "...", refresh: "...", user: {...} }
      if (data.access || data.token) {
        // try common keys
        const access = data.access || data.token || data['jwt token'] || (data.tokens && data.tokens.access);
        const refresh = data.refresh || (data.tokens && data.tokens.refresh);
        if (access) localStorage.setItem('accessToken', access);
        if (refresh) localStorage.setItem('refreshToken', refresh);
      }

      resBox.textContent = '✅ Logged in successfully';
      resBox.className = 'msg success';
      resBox.style.display = 'block';
      // go to protected page or home
      setTimeout(()=> location.href = '/', 700);
    } else {
      resBox.textContent = (data.detail || JSON.stringify(data));
      resBox.className = 'msg error';
      resBox.style.display = 'block';
    }
  } catch (err) {
    resBox.textContent = 'Network error: ' + err;
    resBox.className = 'msg error';
    resBox.style.display = 'block';
  }
};
</script>
{% endblock %}
