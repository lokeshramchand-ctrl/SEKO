<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% block title %}Auth Test{% endblock %}</title>
  <style>
    body{font-family:Inter,system-ui,Arial; background:#f6f7fb; color:#111}
    .card{max-width:480px;margin:48px auto;padding:24px;background:#fff;border-radius:12px;box-shadow:0 6px 20px rgba(10,10,10,0.06)}
    label{display:block;margin:12px 0 6px;font-weight:600}
    input{width:100%;padding:10px;border-radius:8px;border:1px solid #ddd}
    button{margin-top:16px;padding:10px 14px;border-radius:8px;border:0;background:#1f77f3;color:#fff;font-weight:600}
    .muted{color:#666;font-size:0.9rem;margin-top:8px}
    .msg{margin-top:12px;padding:10px;border-radius:8px;}
    .success{background:#e7f5ef;color:#0b6b3a}
    .error{background:#ffe7e7;color:#7b0a0a}
    .small{font-size:0.9rem;color:#666}
    a{color:#1f77f3}
  </style>
</head>
<body>
  <div class="card">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
